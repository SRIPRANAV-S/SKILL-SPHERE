<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SkillSphere — Peer Skill Exchange</title>
  <meta name="description" content="Trade what you know for what you want to learn. AI-assisted peer-to-peer skill exchange platform.">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: light)">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/style.css">
